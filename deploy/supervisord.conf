[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;" -c /etc/nginx/nginx.conf
autostart=true
autorestart=true
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
directory=/opt/apps/web
command=/usr/bin/node /opt/apps/web/server.js
autostart=true
autorestart=true
priority=200
environment=PORT="3000",HOSTNAME="127.0.0.1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
directory=/opt/apps/api
command=/opt/venv-api/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000
autostart=true
autorestart=true
priority=300
environment=PYTHONPATH="/opt/apps/api"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
directory=/opt/apps/api
command=/opt/venv-api/bin/celery -A app.celery_app:celery_app worker -l info
autostart=true
autorestart=true
priority=400
environment=PYTHONPATH="/opt/apps/api"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:beat]
directory=/opt/apps/api
command=/opt/venv-api/bin/celery -A app.celery_app:celery_app beat -l info --pidfile=
autostart=true
autorestart=true
priority=500
environment=PYTHONPATH="/opt/apps/api"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:xvfb]
command=/bin/sh -c 'exec /usr/bin/Xvfb :99 -screen 0 "${BROWSER_NODE_SCREEN:-1280x720x24}" -ac +extension RANDR'
autostart=true
autorestart=true
priority=600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fluxbox]
command=/usr/bin/fluxbox -display :99
autostart=true
autorestart=true
priority=650
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -rfbport 5900 -nopw
autostart=true
autorestart=true
priority=700
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 7900
autostart=true
autorestart=true
priority=750
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:browser-node]
directory=/opt/apps/browser-node
command=/opt/venv-browser-node/bin/uvicorn app.main:app --host 127.0.0.1 --port 9300
autostart=true
autorestart=true
priority=800
environment=PYTHONPATH="/opt/apps/browser-node",DISPLAY=":99"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
