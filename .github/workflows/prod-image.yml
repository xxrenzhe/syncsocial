name: Build & Push Prod Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: prod-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/autosocial"
          COMMIT_ID="${GITHUB_SHA:0:7}"

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            {
              echo "image=${IMAGE}"
              echo "tags<<EOF"
              echo "${IMAGE}:prod-latest"
              echo "${IMAGE}:prod-${COMMIT_ID}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            {
              echo "image=${IMAGE}"
              echo "tags<<EOF"
              echo "${IMAGE}:prod-${VERSION}"
              echo "${IMAGE}:prod-${COMMIT_ID}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Unsupported ref: ${GITHUB_REF}" >&2
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (PAT)
        if: ${{ secrets.GHCR_USERNAME != '' && secrets.GHCR_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Log in to GHCR (GITHUB_TOKEN)
        if: ${{ !(secrets.GHCR_USERNAME != '' && secrets.GHCR_TOKEN != '') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api
